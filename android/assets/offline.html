<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No connection · Bro Code Gaming Zone</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: radial-gradient(circle at 50% 0%, #1a0a10 0%, #07070a 62%);
      color: #f2f2f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 22px;
      display: grid; place-items: center;
      border: 2px solid #ff1f3d; border-radius: 20px;
      font: 800 30px/1 system-ui, sans-serif; color: #ff1f3d;
      letter-spacing: 0.02em;
    }
    h1 { margin: 0 0 10px; font-size: 1.5rem; }
    p { margin: 0 0 26px; color: #9a9aa8; line-height: 1.55; max-width: 34ch; }
    a {
      display: inline-block; padding: 14px 28px;
      background: #ff1f3d; color: #fff; text-decoration: none;
      border-radius: 10px; font-weight: 700; letter-spacing: 0.02em;
    }
    small { display: block; margin-top: 26px; color: #5c5c68; font-size: 0.78rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark">BC</div>
    <h1>We could not reach the zone</h1>
    <p>
      Check your internet connection and try again. If you are on the cafe Wi-Fi,
      the server may be waking up — it usually takes under a minute.
    </p>
    <a href="https://brocode-gaming-zone.onrender.com/">Try again</a>
    <small>Bro Code Gaming Zone · Kalwa Naka, Thane</small>
  </main>
</body>
</html>
